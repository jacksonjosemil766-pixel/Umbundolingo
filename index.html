<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Umbu</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Fredoka:wght@400;500;600&family=Nunito:wght@600;700;800;900&display=swap">
<style>html,body{margin:0;padding:0}</style></head><body>



<style>
/* Layout: app de uma coluna para telemóvel. Cabeçalho fixo (ofensiva, gemas, corações), cinco separadores, trilha em zigzag dentro de 15 secções (cada uma com brasão de sol com N raios), lição em ecrã inteiro. */
:root {
  --bg: #0f1f17;
  --surface: #16291f;
  --surface-2: #1f3a2b;
  --line: #2f5440;
  --fg: #f1fbf3;
  --muted: #9fc2ae;
  --accent: #58cc02;
  --accent-t: #86e332;
  --accent-deep: #3d9400;
  --accent-ink: #082300;
  --accent-soft: rgba(88, 204, 2, 0.16);
  --gold-1: #ffe58a;
  --gold-2: #ffc800;
  --hero-a: #1f5a2d;
  --hero-b: #0f1f17;
  --hero-glow: rgba(88, 204, 2, 0.28);
  --good: #6fe018;
  --good-deep: #3d9400;
  --good-bg: rgba(88, 204, 2, 0.17);
  --on-good: #082300;
  --bad: #ff7676;
  --bad-deep: #c23a3a;
  --bad-bg: rgba(255, 90, 90, 0.16);
  --on-bad: #2d0808;
  --flame: #ff9600;
  --gem: #1cb0f6;
  --heart: #ff4b4b;
  --font-title: 'Outfit', 'Fredoka', system-ui, sans-serif;
  --font-display: 'Fredoka', ui-rounded, 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #eef8e6; --line: #d3e6c6; --fg: #1d3324; --muted: #55705e;
    --accent-t: #2c8200; --accent-deep: #3d9400; --accent-soft: rgba(88, 204, 2, 0.14);
    --gold-1: #b07a00; --gold-2: #d99b00; --hero-a: #d7f5bd; --hero-b: #ffffff; --hero-glow: rgba(88, 204, 2, 0.25);
    --good: #3f9d00; --good-deep: #2c7500; --good-bg: rgba(88, 204, 2, 0.15); --on-good: #ffffff;
    --bad: #d03a3a; --bad-deep: #922626; --bad-bg: rgba(220, 60, 60, 0.1); --on-bad: #ffffff;
    --flame: #e07a00; --gem: #0b8fcc; --heart: #e03b3b;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #eef8e6; --line: #d3e6c6; --fg: #1d3324; --muted: #55705e;
  --accent: #58cc02; --accent-t: #2c8200; --accent-deep: #3d9400; --accent-ink: #082300; --accent-soft: rgba(88, 204, 2, 0.14);
  --gold-1: #b07a00; --gold-2: #d99b00; --hero-a: #d7f5bd; --hero-b: #ffffff; --hero-glow: rgba(88, 204, 2, 0.25);
  --good: #3f9d00; --good-deep: #2c7500; --good-bg: rgba(88, 204, 2, 0.15); --on-good: #ffffff;
  --bad: #d03a3a; --bad-deep: #922626; --bad-bg: rgba(220, 60, 60, 0.1); --on-bad: #ffffff;
  --flame: #e07a00; --gem: #0b8fcc; --heart: #e03b3b;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(90% 38% at 50% 0%, var(--hero-glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.fill { fill: currentColor; }
.eyebrow { font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px; color: var(--accent-t); }
.lead { color: var(--muted); font-size: 15px; }
.app { max-width: 480px; margin: 0 auto; padding-block: 0 130px; }

/* Cabeçalho */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px;
}
.stats { display: flex; gap: 2px; }
.chip { display: flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
.chip.course { padding-left: 0; gap: 8px; font-family: var(--font-title); font-weight: 700; font-size: 17px; letter-spacing: 0.03em; }
.lvl-tag { font-family: var(--font-body); font-size: 12px; font-weight: 900; color: var(--muted); border: 2px solid var(--line); border-radius: 8px; padding: 1px 6px; letter-spacing: 0; }
.flag { width: 28px; height: 20px; border-radius: 4px; position: relative; border: 1px solid var(--line); background: linear-gradient(to bottom, #cc092f 50%, #111 50%); flex: none; }
.flag::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #f2b230; }
.chip.flame { color: var(--flame); }
.chip.gem { color: var(--gem); }
.chip.heart { color: var(--heart); }
button.chip:hover { background: var(--surface); }

/* Herói */
.hero {
  position: relative; overflow: hidden; margin-top: 16px; padding: 18px 16px 16px; border-radius: 26px;
  background: radial-gradient(120% 100% at 100% 0%, var(--hero-glow), transparent 60%), linear-gradient(165deg, var(--hero-a), var(--hero-b));
  border: 2px solid var(--line); display: grid; gap: 12px;
}
.hero-crest { position: absolute; right: -34px; top: -34px; width: 170px; height: 170px; color: var(--gold-2); opacity: 0.22; animation: spin 120s linear infinite; pointer-events: none; }
.hero-crest .crest { width: 100%; height: 100%; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; }
.hero-top > div { min-width: 0; }
.hero-top .hare { width: 76px; height: 76px; flex: none; }
.logo { font-family: var(--font-title); font-weight: 700; font-size: clamp(22px, 7.4vw, 31px); white-space: nowrap; letter-spacing: 0.04em; line-height: 1.1; color: var(--gold-2); overflow-wrap: anywhere; }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .logo { background: linear-gradient(90deg, var(--gold-1), var(--gold-2) 70%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
}
.goal { display: grid; gap: 6px; position: relative; }
.goal-row { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; font-size: 14px; }
.goal-row span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.meter { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), var(--gold-1)); border-radius: 999px; }
.hero-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: relative; }
.hare { display: block; }
.h-body { fill: var(--hare); }
.h-in { fill: var(--hare-in); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Salto entre secções */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.jump { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-family: var(--font-title); font-weight: 700; font-size: 16px; color: var(--muted); }
.jump.cur { border-color: var(--accent); color: var(--accent-t); background: var(--accent-soft); }
.jump.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Secções */
.sec { margin-top: 18px; scroll-margin-top: 70px; }
.sec-banner {
  width: 100%; text-align: left; border-radius: 22px; padding: 14px 14px 14px 12px; color: #fff; position: relative; overflow: hidden;
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  background: linear-gradient(110deg, var(--s-deep) 0 52%, var(--s-light) 135%);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.35);
}
.sec-banner::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 100% 0%, rgba(255, 255, 255, 0.07) 0 7deg, transparent 7deg 14deg);
}
.sec-banner.locked { filter: saturate(0.35); opacity: 0.85; }
.crest-wrap { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, 0.25); color: #fff; position: relative; }
.crest-wrap.gold { background: var(--accent); color: var(--accent-ink); }
.crest { width: 48px; height: 48px; }
.sb-text { display: grid; gap: 2px; min-width: 0; position: relative; }
.sb-text small { font-weight: 900; letter-spacing: 0.09em; text-transform: uppercase; font-size: 11.5px; opacity: 0.9; }
.sb-text b { font-family: var(--font-title); font-weight: 700; font-size: 19px; line-height: 1.15; text-wrap: balance; }
.sb-sub { font-size: 13px; font-weight: 700; opacity: 0.92; font-variant-numeric: tabular-nums; }
.sb-bar { height: 6px; background: rgba(0, 0, 0, 0.3); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.sb-bar i { display: block; height: 100%; background: #fff; border-radius: 999px; }
.chev { position: relative; opacity: 0.95; display: grid; place-items: center; }
.chev .ic { width: 24px; height: 24px; transition: transform 0.2s; }
.sec-banner[aria-expanded="true"] .chev .ic { transform: rotate(180deg); }
.sec-banner.locked .chev .ic { transform: none; }

.unit-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 22px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.unit-label .ul-n { display: block; font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.unit-label b { font-family: var(--font-display); font-weight: 600; font-size: 19px; text-wrap: balance; }
.ul-r { display: flex; align-items: center; gap: 10px; flex: none; }
.dots { display: flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); }
.dots i.on { background: var(--good); border-color: var(--good); }
.guide { width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--accent-t); display: grid; place-items: center; }
.path { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-block: 24px 6px; }
.node-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateX(var(--dx, 0px)); }
.node-wrap.has-tip { margin-top: 26px; }
.node-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.04em; }
.node {
  --deep: var(--line);
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: var(--surface-2); color: var(--muted); box-shadow: 0 6px 0 var(--deep); transition: transform 0.08s, box-shadow 0.08s;
}
.node .ic { width: 32px; height: 32px; }
.node.test { width: 86px; height: 86px; }
.node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--deep); }
.node.done { background: var(--good); color: var(--on-good); --deep: var(--good-deep); }
.node.current { background: var(--s-light); color: var(--s-ink); --deep: var(--s-deep); }
.node.current::after { content: ""; position: absolute; inset: -10px; border: 4px solid var(--s-light); border-radius: 50%; opacity: 0.6; animation: ring 2s ease-in-out infinite; pointer-events: none; }
.tip {
  position: absolute; top: -34px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 3px 10px;
  font-weight: 900; font-size: 13px; color: var(--accent-t); text-transform: uppercase; letter-spacing: 0.06em; animation: bob 1.6s ease-in-out infinite; white-space: nowrap;
}
@keyframes ring { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.12); opacity: 0.25; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* Separadores */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 2px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.tabbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 14px; border: 2px solid transparent; color: var(--muted); font-weight: 900; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; min-width: 0; }
.tab[aria-current="page"] { color: var(--accent-t); border-color: var(--accent); background: var(--accent-soft); }

/* Botões */
.btn {
  width: 100%; padding: 15px 18px; border-radius: 16px; font-family: var(--font-display); font-weight: 600; font-size: 18px;
  letter-spacing: 0.05em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 4px 0 var(--accent-deep); transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn[disabled] { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 var(--line); cursor: not-allowed; transform: none; }
.btn.good { background: var(--good); color: var(--on-good); box-shadow: 0 4px 0 var(--good-deep); }
.btn.bad { background: var(--bad); color: var(--on-bad); box-shadow: 0 4px 0 var(--bad-deep); }
.btn.ghost { background: transparent; color: var(--accent-t); box-shadow: none; border: 2px solid var(--line); }
.btn.small { width: auto; padding: 10px 16px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.spk {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--accent-t);
  display: inline-grid; place-items: center; flex: none;
}
.spk:active { transform: scale(0.94); }
.spk.big { width: 84px; height: 84px; background: var(--accent); color: var(--accent-ink); border: 0; box-shadow: 0 5px 0 var(--accent-deep); }
.spk.big .ic { width: 38px; height: 38px; }
.spk.slow { width: auto; border-radius: 14px; padding: 0 14px; height: 44px; font-weight: 900; font-size: 14px; gap: 6px; display: inline-flex; align-items: center; }

/* Ecrãs de separador */
.page { padding-top: 20px; display: grid; gap: 14px; }
.page h1 { font-family: var(--font-title); font-weight: 700; font-size: 26px; text-wrap: balance; letter-spacing: 0.02em; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.pill { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--good); border-color: var(--good); }
.word-list { display: grid; gap: 8px; }
.word-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.word-row .wt { flex: 1; min-width: 0; display: grid; }
.word-row .u { font-weight: 900; font-size: 18px; overflow-wrap: anywhere; }
.word-row .r { font-size: 13px; color: var(--muted); font-weight: 700; }
.word-row .p { color: var(--muted); font-weight: 700; text-align: right; min-width: 0; max-width: 40%; overflow-wrap: anywhere; font-size: 14px; }
.word-row .spk { width: 38px; height: 38px; }
.word-row .spk .ic { width: 18px; height: 18px; }
.quest { display: grid; gap: 8px; }
.quest-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; }
.quest-top span:last-child { color: var(--gem); display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-variant-numeric: tabular-nums; }
.quest-top .ic { width: 16px; height: 16px; }
.qnum { font-size: 13px; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-tile { border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; display: grid; gap: 2px; text-align: center; background: var(--surface); }
.stat-tile b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat-tile span { font-size: 11px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.who { display: flex; align-items: center; gap: 14px; }
.who .hare { width: 84px; height: 84px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line); font-weight: 900; background: var(--surface); }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-t); background: var(--accent-soft); }
.badges { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.badge { border: 2px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 6px; justify-items: start; background: var(--surface); }
.badge .bi { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.badge.on .bi { background: var(--accent); color: var(--accent-ink); }
.badge b { font-weight: 900; font-size: 15px; line-height: 1.2; }
.badge small { color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1.3; }
.badge:not(.on) { opacity: 0.75; }
.unit-h { font-family: var(--font-title); font-weight: 700; font-size: 20px; margin-top: 10px; letter-spacing: 0.02em; }
details.rev-unit { border: 2px solid var(--line); border-radius: 16px; background: var(--surface); }
details.rev-unit summary { padding: 12px 14px; font-weight: 900; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
details.rev-unit summary::-webkit-details-marker { display: none; }
details.rev-unit summary .count { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.rev-body { display: grid; gap: 10px; padding: 0 12px 12px; }
.rev-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 12px; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; }
.rev-row label.l { display: grid; gap: 2px; font-size: 12px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.rev-row .chk { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-weight: 800; }
.rev-row .chk input { width: 20px; height: 20px; accent-color: var(--good); }
.field { width: 100%; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 17px; font-weight: 800; }
select.field { appearance: auto; }
textarea.field { font-size: 14px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }

/* Lição */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.ov-in { width: 100%; max-width: 480px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ov-top { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.x { color: var(--muted); padding: 6px; border-radius: 10px; }
.x .ic { width: 26px; height: 26px; }
.bar { flex: 1; height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; transition: width 0.3s; }
.lh { display: flex; align-items: center; gap: 4px; color: var(--heart); font-weight: 900; font-variant-numeric: tabular-nums; }

  if (!CLOUD.ref) return;
  clearTimeout(CLOUD.t);
  CLOUD.t = setTimeout(() => { try { CLOUD.ref.set({ json: JSON.stringify(state), savedAt: state.savedAt || 0 }).catch(() => {}); } catch (e) {} }, 2000);
}
async function cloudInit() {
  try {
    if (!(window.claude && window.claude.use)) return;
    const user = await window.claude.use('user'), db = await window.claude.use('db');
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    let email = null; try { email = await user.email(); } catch (e) {}
    if (!email) { try { const me = await user.me(); email = me && me.email; } catch (e) {} }
    CLOUD.email = email || null;
    CLOUD.ref = db.collection('data/users/' + id).doc('progress');
    const snap = await CLOUD.ref.get();
    if (snap.exists) {
      const d = snap.data();
      if (d && d.json && (d.savedAt || 0) > (state.savedAt || 0)) { state = mergeState(JSON.parse(d.json)); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    }
    if (CLOUD.email && !state.profile.email) state.profile.email = CLOUD.email;
    CLOUD.status = 'synced'; save(); render();
  } catch (e) { CLOUD.status = 'local'; }
}
function revRows(unit) {
  return unit.items.map(applyRev).map(i =>
    '<div class="rev-row"><label class="l" for="ru-' + i.id + '">Umbundu<input class="field" type="text" id="ru-' + i.id + '" data-id="' + i.id + '" data-f="u" value="' + esc(i.u) + '" autocapitalize="off" spellcheck="false"></label>' +
    '<label class="l" for="rp-' + i.id + '">Português<input class="field" type="text" id="rp-' + i.id + '" data-id="' + i.id + '" data-f="p" value="' + esc(i.p) + '" spellcheck="false"></label>' +
    '<label class="chk" for="rc-' + i.id + '"><input type="checkbox" id="rc-' + i.id + '" data-id="' + i.id + '" data-unit="' + unit.id + '" data-f="ok"' + (i.ok ? ' checked' : '') + '>Certo, confirmado por falante nativo</label></div>').join('');
}
function renderReview() {
  let h = '<div class="page"><button class="btn small ghost" data-act="back-profile">' + ic('back') + 'Perfil</button><h1>Rever o conteúdo</h1><p class="lead">Para professores e falantes nativos. Corrige a escrita ou o significado e marca «Certo» quando estiver confirmado. As correções ficam só neste telemóvel: copia o relatório e envia ao criador para entrarem no app para todos.</p>';
  SECTIONS.forEach((sec, si) => {
    h += '<h3 class="unit-h">Secção ' + (si + 1) + ' · ' + esc(sec.title) + '</h3>';
    sec.units.forEach(unit => {
      const items = unit.items.map(applyRev), okc = items.filter(i => i.ok).length;
      h += '<details class="rev-unit" data-ru="' + unit.id + '"><summary><span>' + esc(unit.title) + '</span><span class="count" id="cnt-' + unit.id + '">' + okc + '/' + items.length + ' revistas</span></summary><div class="rev-body"></div></details>';
    });
  });
  h += '<div class="card"><h2>Fontes</h2><p class="lead"><b>Mundumbundu</b> (mundumbundu.ao): dicionário gratuito Português–Umbundu, usado aqui para fins educacionais. <b>2 fontes</b>: palavra do Guia também confirmada no Omniglot. <b>Só no Guia</b>: vem apenas do Guia de Umbundu do autor do app. A voz sintética e o guia de leitura são aproximados e não substituem um falante nativo.</p></div>' +
    '<button class="btn" data-act="report">Copiar relatório</button><textarea id="reportBox" class="field" rows="10" readonly hidden aria-label="Relatório de revisão"></textarea></div>';
  $('#view').innerHTML = h;
  document.querySelectorAll('details[data-ru]').forEach(d => d.addEventListener('toggle', () => {
    const b = d.querySelector('.rev-body');
    if (d.open && !b.firstChild) { const u = UNITS.find(x => x.id === d.dataset.ru); b.innerHTML = revRows(u); }
  }));
}
function setRev(id, f, v) {
  const o = origItem(id); if (!o) return;
  const r = state.rev[id] || (state.rev[id] = { u: o.u, p: o.p, ok: false });
  r[f] = v; save();
}
function reportText() {
  const L = ['Umbu · relatório de revisão', ''];
  SECTIONS.forEach((sec, si) => {
    L.push('## Secção ' + (si + 1) + ' · ' + sec.title);
    sec.units.forEach(unit => {
      L.push('# ' + unit.title);
      unit.items.forEach(o => {
        const i = applyRev(o), ch = i.u !== o.u || i.p !== o.p;
        L.push([i.u, i.p, 'FONTE: ' + (o.src === 'M' ? 'Mundumbundu' : o.src === 'C' ? '2 fontes' : 'só Guia'), i.ok ? 'REVISTO' : 'POR REVER', ch ? 'ALTERADO (antes: ' + o.u + ' = ' + o.p + ')' : ''].filter(Boolean).join(' | '));
      });
    });
    L.push('');
  });
  return L.join('\n');
}

    return;
  }
  const jp = e.target.closest('[data-jump]');

  const gd = e.target.closest('[data-guide]'); if (gd) { openGuide(gd.dataset.guide); return; }
  const cl = e.target.closest('[data-claim]');
  if (cl) {
    const q = QUESTS.find(x => x.id === cl.dataset.claim), d = today();

    return;
  }
  const hb = e.target.closest('[data-helper]'); if (hb) { state.helper = hb.dataset.helper; save(); sfx('pop'); renderProfile(); toast(helperOf(state.helper).name + ': ' + pick(helperOf(state.helper).tip)); return; }
  const bd = e.target.closest('[data-buddy]'); if (bd) { const hp = helperOf(bd.dataset.buddy); sfx('pop'); toast(hp.name + ': ' + pick(hp.tip)); return; }
  const cn = e.target.closest('[data-cal]'); if (cn && !cn.disabled) { calOff += +cn.dataset.cal; renderQuests(); return; }
  const ti = e.target.closest('[data-theme-id]'); if (ti) { state.theme.id = ti.dataset.themeId; save(); applyTheme(); sfx('pop'); renderProfile(); return; }
  const tb = e.target.closest('[data-bg-id]'); if (tb) { state.theme.bg = tb.dataset.bgId; save(); applyTheme(); sfx('pop'); renderProfile(); return; }
  const tm = e.target.closest('[data-mode]'); if (tm) { state.theme.mode = tm.dataset.mode; save(); applyTheme(); sfx('pop'); renderProfile(); return; }
  const da = e.target.closest('[data-dall]'); if (da) { dq.only = da.dataset.dall === '0'; dq.conf = da.dataset.dall === '2'; dq.n = 60; renderDict(); return; }
  const gl = e.target.closest('[data-goal]'); if (gl) { state.goal = +gl.dataset.goal; save(); renderProfile(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'voice') openVoiceSheet();
  else if (act === 'practice-mix') startPractice('mix');
  else if (act === 'practice-listen') startPractice('listen');
  else if (act === 'practice-errors') startPractice('errors');
  else if (act === 'buy-freeze') { if (state.gems >= 50) { state.gems -= 50; state.freezes++; save(); updateHeader(); renderProfile(); toast('Congelamento comprado.'); } }
  else if (act === 'reset') openSheet('Apagar progresso?', '<p>Isto apaga lições, XP, gemas, ofensiva e as tuas correções neste telemóvel. Não dá para desfazer.</p>', [
    { label: 'Manter progresso' },
    { label: 'Apagar tudo', kind: 'bad', fn: () => { state = JSON.parse(JSON.stringify(DEF)); save(); openSecs = null; firstScroll = true; tab = 'learn'; render(); window.scrollTo(0, 0); } }
  ]);
  else if (act === 'lock') { try { localStorage.removeItem(KEYSTORE); } catch (err) {} location.reload(); }
  else if (act === 'avatar') openAvatarEditor();
  else if (act === 'ask-ai') askAI(a);
  else if (act === 'hint') { if (S && S.cur && !S.cur.answered) { const hb = document.querySelector('#stage .hintbox'); hb.innerHTML = hintFor(S.cur); hb.hidden = false; a.hidden = true; S.hints = (S.hints || 0) + 1; sfx('pop'); } }
  else if (act === 'practice-due') startPractice('due');

  else if (act === 'practice-frases') startPractice('frases');
  else if (act === 'fl-show') flashShow();

  else if (act === 'practice-flash') startPractice('flash');
  else if (act === 'bk-copy') backupCopy();
  else if (act === 'bk-file') backupFile();
  else if (act === 'bk-restore') openRestore();
  else if (act === 'rp-open') openReport(S ? (S.mode === 'intro' ? S.node.intro[introI] : S.cur && S.cur.item) : null);
  else if (act === 'report-send') sendReport();
  else if (act === 'report-clear') { state.reports = []; save(); renderProfile(); toast('Reportes apagados.'); }
  else if (act === 'google') googleLogin();
  else if (act === 'dict-more') { dq.n += 60; $('#dictOut').innerHTML = dictList(); }
  else if (act === 'daily-chest') { const d = ymd(new Date()); if (state.dailyChest !== d) { state.dailyChest = d; const g = 15 + Math.floor(Math.random() * 16); state.gems += g; if (state.hearts < MAXH) state.hearts++; save(); updateHeader(); sfx('gem'); renderQuests(); toast('Baú diário: +' + g + ' gemas'); } }
  else if (act === 'use-acc') { state.avatar.acc = [a.dataset.id]; save(); sfx('pop'); renderShop(); }
  else if (act === 'buy-acc') buyAcc(a.dataset.id);
  else if (act === 'refill1') { if (state.hearts < MAXH && state.gems >= 20) { state.gems -= 20; state.hearts++; if (state.hearts >= MAXH) state.heartsAt = 0; save(); updateHeader(); sfx('buy'); renderShop(); } }
  else if (act === 'refillAll') { if (state.hearts < MAXH - 1 && state.gems >= 60) { state.gems -= 60; state.hearts = MAXH; state.heartsAt = 0; save(); updateHeader(); sfx('buy'); renderShop(); } }
  else if (act === 'open-review') { tab = 'review'; render(); window.scrollTo(0, 0); }
  else if (act === 'back-profile') { tab = 'profile'; render(); window.scrollTo(0, 0); }
  else if (act === 'report') {

    catch (err) { toast('Seleciona o texto abaixo e copia.'); }
  }
};

(function () {
  const fb = document.getElementById('fb'); if (!fb || !window.MutationObserver) return;

    const ok = !fb.hidden && !!fb.querySelector('.fb.ok'), bad = !fb.hidden && !!fb.querySelector('.fb.bad');
    if (ok && !shown) {
      shown = true; try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}

})();
